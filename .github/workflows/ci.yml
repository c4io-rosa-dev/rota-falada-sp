name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgrouting/pgrouting:latest
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: acessibilidade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:dev@localhost:5432/acessibilidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm run orcamento
      # o gitleaks olha o repositório; o que vai ao ar é o dist
      - name: Nenhum segredo no bundle
        run: |
          if grep -rEl 'sb_secret_|eyJ[A-Za-z0-9_-]{10,}\.' dist; then
            echo "Segredo no bundle: confira as variáveis VITE_ do build."
            exit 1
          fi

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -p tsconfig.e2e.json
      - run: npx playwright test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 quebra no primeiro push de um repositório
      # (o commit raiz não tem pai para o diff "<raiz>^..HEAD" que a action monta:
      # https://github.com/gitleaks/gitleaks-action/issues/199). Para não depender
      # desse bug, baixamos o binário (mesma versão do pre-commit) e escaneamos
      # o histórico inteiro a cada execução.
      - name: Baixar e rodar o gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose --redact
