services:
  db:
    image: pgrouting/pgrouting:latest
    container_name: rota-falada-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: acessibilidade
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acessibilidade"]
      interval: 5s
      timeout: 3s
      retries: 20

  etl:
    build: ./etl
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@db:5432/acessibilidade
    volumes:
      - ./etl:/app
      - ./etl/dados:/app/dados

volumes:
  pgdata:
